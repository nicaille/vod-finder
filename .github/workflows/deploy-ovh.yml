name: Test et déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DATABASE_URL: ''
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, xmlwriter, curl, openssl
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer, tester et construire
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          composer install --prefer-dist --no-interaction --optimize-autoloader
          npm ci
          npm run test:cache
          npm run build
          npm run build:ui
      - name: Tests Laravel sur SQLite en mémoire
        run: php artisan test --compact
      - name: Tester le script de déploiement dans un conteneur isolé
        run: docker run --rm --entrypoint bash -v "$PWD:/source:ro" debian:bookworm-slim /source/tests/Deployment/ovh-deploy.sh
      - name: Préparer l’archive
        run: bash scripts/package-release.sh "$RUNNER_TEMP/release.tar.gz"
      - name: Déployer par SSH
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$OVH_SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$OVH_SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ -n "$OVH_SSH_KEY" && -n "$OVH_SSH_KNOWN_HOSTS" ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/ovh-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$OVH_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20)
          remote="$OVH_SSH_USER@$OVH_SSH_HOST"
          ssh "${ssh_options[@]}" "$remote" 'umask 077; mkdir -p ~/.vod-finder-deploy/incoming'
          scp "${ssh_options[@]}" "$RUNNER_TEMP/release.tar.gz" "$remote:.vod-finder-deploy/incoming/$GITHUB_SHA.tar.gz"
          scp "${ssh_options[@]}" scripts/deploy-ovh.sh "$remote:.vod-finder-deploy/incoming/$GITHUB_SHA.sh"
          archive_hash=$(sha256sum "$RUNNER_TEMP/release.tar.gz")
          ssh "${ssh_options[@]}" "$remote" "bash ~/.vod-finder-deploy/incoming/$GITHUB_SHA.sh ~/.vod-finder-deploy/incoming/$GITHUB_SHA.tar.gz ${archive_hash%% *} $GITHUB_SHA '~/vod-finder/prod' /usr/local/php8.5/bin/php"
      - name: Vérifier le site public
        run: curl --fail --silent --show-error --location --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors https://app-vod.venoix.fr/about --output /dev/null
